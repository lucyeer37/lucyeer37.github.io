name: Sync Sifeng guestbook

on:
  push:
    branches: [main]
    paths: [.github/workflows/sifeng-guestbook.yml]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited, closed, reopened, locked, unlocked]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write

concurrency:
  group: sifeng-guestbook-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Save public guestbook snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def api(route, method='GET', data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(base + route, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'sifeng-guestbook-sync'
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          issue = api('/issues/1')
          comments = []
          page = 1
          while True:
              batch = api('/issues/1/comments?per_page=100&page=' + str(page))
              comments.extend({
                  'id': item['id'], 'body': item.get('body', ''),
                  'created_at': item['created_at'], 'updated_at': item.get('updated_at'),
                  'user': {'login': (item.get('user') or {}).get('login', '已注销用户')}
              } for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          snapshot = {
              'issue_number': 1, 'total': len(comments), 'locked': bool(issue.get('locked')),
              'updated_at': datetime.now(timezone.utc).isoformat(), 'comments': comments
          }
          contents = base64.b64encode((json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n').encode()).decode()
          route = '/contents/sifeng/guestbook-data.json'
          data = {'message': 'Sync sifeng guestbook comments', 'branch': 'main', 'content': contents}
          try:
              current = api(route + '?ref=main')
              data['sha'] = current['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          api(route, method='PUT', data=data)
          api('/pages/builds', method='POST')
          print('Synced', len(comments), 'guestbook comments.')
          PY
